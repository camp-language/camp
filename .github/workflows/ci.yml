name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run checks via container
        run: |
          docker build -t camp-ci:test -f Containerfile .
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            camp-ci:test \
            bash -c "git config --global --add safe.directory /work && just check"
