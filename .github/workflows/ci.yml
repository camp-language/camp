name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4

      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install odinfmt
        run: |
          OLS_VERSION=$(curl -s https://api.github.com/repos/DanielGavin/ols/releases/latest | jq -r '.tag_name')
          curl -L -o ols.zip "https://github.com/DanielGavin/ols/releases/download/${OLS_VERSION}/ols-x86_64-unknown-linux-gnu.zip"
          unzip -o ols.zip "odinfmt*" -d /usr/local/bin
          mv /usr/local/bin/odinfmt-x86_64-unknown-linux-gnu /usr/local/bin/odinfmt
          chmod +x /usr/local/bin/odinfmt
          rm ols.zip

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Run checks
        run: just check
