name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Install Odin
        run: |
          ODIN_VERSION=$(curl -s https://api.github.com/repos/odin-lang/Odin/releases/latest | jq -r '.tag_name')
          curl -L -o odin.tar.gz "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"
          sudo tar -xzf odin.tar.gz -C /usr/local
          ODIN_DIR=$(ls -d /usr/local/odin-linux-*)
          sudo ln -s "$ODIN_DIR" /usr/local/odin
          sudo ln -s /usr/local/odin/odin /usr/local/bin/odin
          echo "ODIN_ROOT=$ODIN_DIR" >> "$GITHUB_ENV"
          rm odin.tar.gz

      - name: Build compiler
        run: odin build src -collection:camp=src -out:camp

      - name: Build E2E runner
        run: odin build src/e2e -collection:camp=src -out:camp-e2e

      - name: Unit tests
        run: |
          odin test src -collection:camp=src || echo "FAIL: odin test src"
          odin test src/base -collection:camp=src || echo "FAIL: odin test src/base"
          odin test src/diagnostics -collection:camp=src || echo "FAIL: odin test src/diagnostics"
          odin test src/frontend -collection:camp=src || echo "FAIL: odin test src/frontend"
          odin test src/semantics -collection:camp=src || echo "FAIL: odin test src/semantics"
          odin test src/mono -collection:camp=src || echo "FAIL: odin test src/mono"
          odin test src/ir -collection:camp=src || echo "FAIL: odin test src/ir"
          odin test src/codegen -collection:camp=src || echo "FAIL: odin test src/codegen"
          odin test src/build -collection:camp=src || echo "FAIL: odin test src/build"
          odin test src/format -collection:camp=src || echo "FAIL: odin test src/format"

      - name: E2E tests
        run: CAMP_BIN="$GITHUB_WORKSPACE/camp" ./camp-e2e

      - name: Tree-sitter tests
        run: |
          cd tree-sitter && tree-sitter generate && tree-sitter test
        continue-on-error: true

      - name: Tree-sitter validate
        run: |
          cd tree-sitter
          for f in ../tests/e2e/**/*.camp; do
            if tree-sitter parse "$f" 2>&1 | grep -q 'ERROR'; then
              echo "FAIL: $f has parse errors" && exit 1
            fi
          done
          echo "All .camp files parse successfully"
        continue-on-error: true
